[project]
name = "document-qa"
version = "2.0.0"
description = "Persian question answering over organizational documents with citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
        "llama-index-llms-openai-like>=0.1.3",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    
    # LlamaIndex
    "llama-index-core>=0.11.0",
    "llama-index-vector-stores-qdrant>=0.2.0",
    
    # Qdrant
    "qdrant-client>=1.9.0",
    
    # PDF & Text
    "pymupdf>=1.24.0",
    "tokenizers>=0.19.0",
    
    # Embedding
    "onnxruntime>=1.18.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests that require real Qdrant (run inside Docker)",
    "model: marks tests that require the real local ONNX model",
    "live: marks tests that call the real language model",
]
addopts = "-m 'not integration and not model and not live'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_qa"]